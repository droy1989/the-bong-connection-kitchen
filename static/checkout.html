<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The Bong Connection &bull; Checkout &amp; Payment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Noto Sans Bengali', system-ui, sans-serif;
            color: #351b13;
            background: #fff7e8;
            min-height: 100vh;
            padding: 20px 16px 40px;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -15px;
            background: linear-gradient(rgba(255, 247, 232, .45), rgba(255, 247, 232, .50)), url('/static/durga-puja.jpg');
            background-size: cover;
            background-position: center top;
            filter: blur(4px);
            transform: scale(1.04);
            z-index: -2;
        }

        .wrap {
            max-width: 540px;
            margin: 0 auto;
        }

        .header-card {
            text-align: center;
            background: linear-gradient(135deg, #641010, #a91616 50%, #741010);
            color: #fff;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 25px rgba(100, 30, 10, .22);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .header-card h1 {
            margin: 0;
            font-family: 'Playfair Display', serif;
            font-size: 26px;
        }

        .header-card .bengali-sub {
            color: #ffd98a;
            font-size: 16px;
            font-weight: 700;
            margin-top: 4px;
        }

        .card {
            background: rgba(255, 253, 249, .96);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 20px;
            border: 1px solid #ead8b9;
            box-shadow: 0 5px 18px rgba(80, 35, 10, .08);
            backdrop-filter: blur(4px);
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 700;
            color: #671010;
            margin-top: 0;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f3e5ca;
            padding-bottom: 10px;
        }

        .token-badge {
            display: inline-block;
            background: #ffe3a3;
            color: #7b1010;
            font-size: 22px;
            font-weight: 800;
            padding: 6px 16px;
            border-radius: 12px;
            border: 1px solid #e2bc69;
            margin-bottom: 12px;
        }

        .order-items-table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
        }

        .order-items-table td {
            padding: 10px 0;
            border-bottom: 1px dashed #e8d7ba;
            font-size: 15px;
        }

        .order-items-table td.price-col {
            text-align: right;
            font-weight: 700;
            color: #5f1010;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 2px solid #a91616;
            font-size: 20px;
            font-weight: 800;
            color: #7b1010;
        }

        .payment-options {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 16px;
        }

        .pay-app-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .15);
            transition: transform .15s ease, box-shadow .15s ease;
            cursor: pointer;
            border: none;
        }

        .pay-app-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, .22);
        }

        .pay-app-btn:active {
            transform: scale(.98);
        }

        .btn-razorpay {
            background: linear-gradient(135deg, #072654, #1a53ba);
            font-size: 18px;
            padding: 18px 20px;
            box-shadow: 0 6px 20px rgba(7, 38, 84, .35);
            position: relative;
            overflow: hidden;
        }

        .btn-razorpay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, .08), transparent);
        }

        .btn-razorpay:hover {
            box-shadow: 0 8px 24px rgba(7, 38, 84, .45);
        }

        .btn-razorpay:disabled {
            background: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .razorpay-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(255, 255, 255, .15);
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .5px;
            text-transform: uppercase;
        }

        .divider-or {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 18px 0 4px;
            color: #999;
            font-size: 13px;
            font-weight: 700;
        }

        .divider-or::before,
        .divider-or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #ead8b9;
        }

        .btn-gpay {
            background: linear-gradient(135deg, #1a73e8, #0d5bbd);
        }

        .btn-phonepe {
            background: linear-gradient(135deg, #5f259f, #4a1c7f);
        }

        .btn-upi {
            background: linear-gradient(135deg, #00897b, #00695c);
        }

        .btn-icon {
            font-size: 22px;
            display: flex;
            align-items: center;
        }

        .qr-section {
            text-align: center;
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px solid #ead8b9;
        }

        .qr-box {
            display: inline-block;
            background: #fff;
            padding: 14px;
            border-radius: 16px;
            border: 2px solid #e3c896;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .06);
            margin: 12px 0;
        }

        .qr-box img {
            display: block;
            width: 200px;
            height: 200px;
            border-radius: 8px;
        }

        .upi-id-display {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fff3d8;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid #e0c283;
            font-size: 14px;
            font-weight: 700;
            color: #641010;
        }

        .copy-btn {
            background: #7b1010;
            color: #fff;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 700;
        }

        .confirm-btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #16823b, #25994b);
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            padding: 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 4px 15px rgba(22, 130, 59, .3);
            transition: transform .15s ease, background .15s ease;
            text-align: center;
        }

        .confirm-btn:hover {
            background: linear-gradient(135deg, #137434, #1e8741);
            transform: translateY(-1px);
        }

        .confirm-btn:disabled {
            background: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .step-badge {
            display: inline-block;
            background: #16823b;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin-bottom: 8px;
        }

        .utr-input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #b7dfc6;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            color: #171717;
            background: #fff;
            letter-spacing: .5px;
            transition: border-color .2s, box-shadow .2s;
        }

        .utr-input:focus {
            outline: none;
            border-color: #16823b;
            box-shadow: 0 0 0 3px rgba(22, 130, 59, .15);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 14px;
            color: #7b1010;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
        }

        .loading-state {
            text-align: center;
            padding: 40px 20px;
            font-size: 18px;
            font-weight: 700;
            color: #7b1010;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <a href="/" class="back-link">&#8592; Back to Menu</a>
        <div class="header-card">
            <h1>&#127774; The Bong Connection</h1>
            <div class="bengali-sub">&#2470;&#2497;&#2480;&#2509;&#2455;&#2494;&#2474;&#2499;&#2460;&#2494;
                &#2488;&#2509;&#2474;&#2503;&#2486;&#2494;&#2482; &bull; Order Checkout</div>
        </div>
        <div id="content" class="loading-state">Loading order details...</div>
    </div>

    <script>
        var urlParams = new URLSearchParams(location.search);
        var orderId = urlParams.get('id');
        var razorpayKeyId = '';

        async function loadCheckout() {
            var content = document.getElementById("content");
            if (!orderId) { content.innerHTML = '<div class="card" style="text-align:center"><h2>Order Not Found</h2><p>No order ID provided.</p><a href="/" class="pay-app-btn btn-gpay" style="display:inline-block;width:auto;padding:10px 20px">Return to Menu</a></div>'; return; }
            try {
                var response = await fetch('/api/orders/' + orderId);
                if (!response.ok) { content.innerHTML = '<div class="card" style="text-align:center"><h2>Order Not Found</h2><p>Unable to retrieve order details.</p><a href="/" class="pay-app-btn btn-gpay" style="display:inline-block;width:auto;padding:10px 20px">Return to Menu</a></div>'; return; }
                var order = await response.json();
                var configRes = await fetch('/api/config');
                var config = configRes.ok ? await configRes.json() : {};
                razorpayKeyId = config.razorpay_key_id || '';
                var itemsHtml = order.items.map(function (item) { return '<tr><td><strong>' + escapeHtml(item.name) + '</strong> &times; ' + item.quantity + '</td><td class="price-col">&#8377;' + (item.price * item.quantity) + '</td></tr>'; }).join('');
                var rzpBtn = razorpayKeyId ? ('<button type="button" id="razorpayBtn" class="pay-app-btn btn-razorpay" onclick="openRazorpay(' + order.id + ',' + order.total + ')">' +
                    '<span class="btn-icon" style="margin-right:8px">&#128179;</span><span style="margin-right:8px">Pay &#8377;' + order.total + ' Securely</span><span class="razorpay-badge" style="margin-left:8px">Razorpay</span>' +
                    '</button><div style="font-size:12px;color:#666;text-align:center;margin-top:-4px">Cards &middot; UPI &middot; NetBanking &middot; Wallets &mdash; Confirmed automatically &#10003;</div>') :
                    '<div style="color:#d32f2f;font-weight:700;text-align:center">Online payment is temporarily unavailable. Please check with the stall staff.</div>';
                content.innerHTML =
                    '<div class="card">' +
                    '<div class="card-title">&#128717; Order Summary</div>' +
                    '<div style="text-align:center"><div class="token-badge">Token #' + order.token + '</div></div>' +
                    '<table class="order-items-table"><tbody>' + itemsHtml + '</tbody></table>' +
                    '<div class="total-row"><span>Total Amount</span><span>&#8377;' + order.total + '</span></div>' +
                    '</div>' +
                    '<div class="card">' +
                    '<div class="card-title">&#128179; Complete Payment</div>' +
                    '<div id="rzpError" style="color:#d32f2f;font-size:13px;font-weight:700;margin-bottom:10px;display:none"></div>' +
                    rzpBtn +
                    '</div>' +
                    '<div class="card" style="text-align:center;padding:18px 20px">' +
                    '<div id="pollingStatus" style="font-size:14px;font-weight:600;color:#641010;display:flex;align-items:center;justify-content:center;gap:10px">' +
                    '<div style="width:20px;height:20px;border:3px solid #f3e5ca;border-top:3px solid #a91616;border-radius:50%;animation:spin 1s linear infinite"></div>' +
                    '<div>Awaiting payment confirmation. Pay above to place your order in the queue.</div>' +
                    '</div>' +
                    '</div>';
                startAutoPolling(order.id);
            } catch (err) {
                console.error(err);
                content.innerHTML = '<div class="card" style="text-align:center"><h2>Error</h2><p>Something went wrong loading order details.</p><a href="/" class="pay-app-btn btn-gpay" style="display:inline-block;width:auto;padding:10px 20px">Return to Menu</a></div>';
            }
        }

        async function openRazorpay(localOrderId, totalRupees) {
            var btn = document.getElementById('razorpayBtn');
            var errEl = document.getElementById('rzpError');
            if (errEl) { errEl.style.display = 'none'; errEl.textContent = ''; }
            if (btn) { btn.disabled = true; btn.textContent = 'Creating secure payment...'; }
            try {
                var res = await fetch('/api/create-razorpay-order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ order_id: localOrderId }) });
                if (!res.ok) { var e = await res.json().catch(function () { return {}; }); throw new Error(e.detail || 'Could not create payment order'); }
                var rzpData = await res.json();
                var options = {
                    key: rzpData.key_id,
                    amount: rzpData.amount,
                    currency: rzpData.currency,
                    name: 'The Bong Connection',
                    description: 'Order #' + localOrderId,
                    order_id: rzpData.razorpay_order_id,
                    handler: async function (response) {
                        await verifyRazorpayPayment(localOrderId, response.razorpay_payment_id, response.razorpay_order_id, response.razorpay_signature);
                    },
                    notes: { local_order_id: localOrderId },
                    theme: { color: '#a91616' },
                    modal: {
                        ondismiss: function () {
                            if (btn) { btn.disabled = false; btn.innerHTML = '<span class="btn-icon" style="margin-right:8px">&#128179;</span><span style="margin-right:8px">Pay &#8377;' + totalRupees + ' Securely</span><span class="razorpay-badge" style="margin-left:8px">Razorpay</span>'; }
                        }
                    }
                };
                var rzp = new Razorpay(options);
                rzp.on('payment.failed', function (response) {
                    if (btn) { btn.disabled = false; btn.innerHTML = '<span class="btn-icon" style="margin-right:8px">&#128179;</span><span style="margin-right:8px">Pay &#8377;' + totalRupees + ' Securely</span><span class="razorpay-badge" style="margin-left:8px">Razorpay</span>'; }
                    if (errEl) { errEl.textContent = 'Payment failed: ' + (response.error.description || 'Please try again.'); errEl.style.display = 'block'; }
                });
                rzp.open();
            } catch (e) {
                console.error(e);
                if (btn) { btn.disabled = false; btn.innerHTML = '<span class="btn-icon" style="margin-right:8px">&#128179;</span><span style="margin-right:8px">Pay &#8377;' + totalRupees + ' Securely</span><span class="razorpay-badge" style="margin-left:8px">Razorpay</span>'; }
                if (errEl) { errEl.textContent = e.message || 'Something went wrong. Please try again.'; errEl.style.display = 'block'; }
            }
        }

        async function verifyRazorpayPayment(localOrderId, paymentId, rzpOrderId, signature) {
            var errEl = document.getElementById('rzpError');
            try {
                var res = await fetch('/api/verify-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ local_order_id: localOrderId, razorpay_payment_id: paymentId, razorpay_order_id: rzpOrderId, razorpay_signature: signature }) });
                if (!res.ok) { var e = await res.json().catch(function () { return {}; }); throw new Error(e.detail || 'Signature verification failed'); }
                var statusEl = document.getElementById('pollingStatus');
                if (statusEl) { statusEl.innerHTML = '<div style="font-size:40px;margin-bottom:6px">&#127881;</div><div style="font-size:18px;color:#16823b;font-weight:800">Payment Successful!</div><div style="font-size:14px;color:#555">Opening your live order &amp; queue position...</div>'; }
                setTimeout(function () { location.href = '/static/order.html?id=' + localOrderId; }, 1000);
            } catch (e) {
                console.error(e);
                if (errEl) { errEl.textContent = 'Payment verification failed: ' + (e.message || 'Please contact support.'); errEl.style.display = 'block'; }
            }
        }

        var pollInterval = null;
        function startAutoPolling(id) {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async function () {
                try {
                    var r = await fetch('/api/orders/' + id);
                    if (r.ok) {
                        var data = await r.json();
                        if (data.payment_status === 'PAID') {
                            clearInterval(pollInterval);
                            var statusEl = document.getElementById('pollingStatus');
                            if (statusEl) { statusEl.innerHTML = '<div style="font-size:40px;margin-bottom:6px">&#127881;</div><div style="font-size:18px;color:#16823b;font-weight:800">Payment Successful!</div><div style="font-size:14px;color:#555">Opening your live order &amp; queue position...</div>'; }
                            setTimeout(function () { location.href = '/static/order.html?id=' + id; }, 1000);
                        }
                    }
                } catch (e) { console.error('Polling error:', e); }
            }, 1500);
        }

        function escapeHtml(value) {
            return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        loadCheckout();
    </script>
</body>

</html>
