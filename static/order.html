<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Bong Connection — Order</title>
<style>
body{font-family:system-ui;text-align:center;background:#f7f7f7;padding:25px;color:#222}
.card{background:white;padding:25px;border-radius:18px;max-width:500px;margin:auto;box-shadow:0 2px 10px #ddd}
.brand{font-weight:800}.token{font-size:82px;font-weight:900;margin:5px}
.status{display:inline-block;padding:9px 14px;border-radius:20px;background:#eee;font-weight:800}
.ready{background:#d8f5df;color:#126b2e}.prep{background:#fff1c9;color:#795900}
hr{border:0;border-top:1px solid #ddd;margin:20px 0}
</style></head><body><div class="card">
<div class="brand">🪔 THE BONG CONNECTION</div><h1>Order Status</h1>
<div>Your queue number</div><div class="token" id="token">-</div>
<div id="status" class="status">Loading...</div><div id="message" style="margin-top:12px"></div>
<hr><div id="items"></div><h2 id="total"></h2></div>
<script>
const id=new URLSearchParams(location.search).get('id');
async function load(){let r=await fetch('/api/orders/'+id);if(!r.ok)return;let o=await r.json();
token.textContent='#'+o.token;status.textContent=o.order_status;
status.className='status '+(o.order_status==='READY'?'ready':o.order_status==='PREPARING'?'prep':'');
message.textContent=o.order_status==='READY'?'🎉 Please collect your order from the counter.':o.order_status==='PREPARING'?'👨‍🍳 Your food is being prepared.':'⏳ Your order is in the queue.';
items.innerHTML=o.items.map(x=>`${x.quantity} × ${x.name} — ₹${x.price*x.quantity}`).join('<br>');
total.textContent='Total ₹'+o.total;if(o.order_status!=='DELIVERED')setTimeout(load,3000)}
load();
</script></body></html>
