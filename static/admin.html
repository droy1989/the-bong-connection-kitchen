<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>The Bong Connection — Kitchen</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            font-family: system-ui;
            margin: 0;
            background: #f4f4f4;
            color: #171717
        }

        header {
            background: #111;
            color: white;
            padding: 16px;
            text-align: center
        }

        header h1 {
            margin: 0
        }

        .login {
            max-width: 500px;
            margin: 18px auto;
            padding: 14px;
            background: white;
            border-radius: 12px
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 70%
        }

        .btn {
            border: 0;
            padding: 11px 14px;
            border-radius: 9px;
            background: #111;
            color: #fff;
            font-weight: 700;
            cursor: pointer
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            padding: 16px;
            max-width: 1400px;
            margin: auto
        }

        .col {
            background: #e9e9e9;
            border-radius: 14px;
            padding: 12px;
            min-height: 70vh
        }

        .col h2 {
            margin: 5px 0 12px;
            text-align: center
        }

        .order {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin: 10px 0;
            box-shadow: 0 1px 4px #ccc
        }

        .token {
            font-size: 30px;
            font-weight: 900
        }

        .items {
            margin: 8px 0
        }

        .total {
            font-weight: 800;
            margin: 8px 0
        }

        .btn.start {
            background: #155eef
        }

        .btn.ready {
            background: #16833b
        }

        .btn.deliver {
            background: #555;
            width: 100%
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 25px
        }

        .small {
            font-size: 12px;
            color: #777
        }

        .summary {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 16px
        }

        .summary-bar {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .stat {
            background: white;
            border-radius: 12px;
            padding: 12px 18px;
            box-shadow: 0 1px 4px #ccc;
            text-align: center;
            min-width: 110px
        }

        .stat .num {
            font-size: 26px;
            font-weight: 900
        }

        .stat .lbl {
            font-size: 12px;
            color: #777;
            font-weight: 700
        }

        .prep {
            background: white;
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 1px 4px #ccc
        }

        .prep h3 {
            margin: 0 0 10px
        }

        .prep-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .prep-item {
            background: #fff3e0;
            border: 1.5px solid #f0a83d;
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 14px;
            font-weight: 700;
            color: #7a4a00
        }

        .prep-item .qty {
            font-size: 16px;
            color: #b91c1c;
            margin-right: 4px
        }

        @media(max-width:800px) {
            .board {
                grid-template-columns: 1fr
            }

            .col {
                min-height: auto
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🪔 THE BONG CONNECTION</h1>
        <div>Kitchen Queue</div>
        <div style="margin-top:6px"><a href="/admin/menu" style="color:#9cf;font-size:13px">🍽️ Manage Menu</a></div>
    </header>
    <div class="login"><input id="key" type="password" placeholder="Admin key">
        <button class="btn" onclick="login()">Login</button> <span id="msg" class="small"></span>
    </div>
    <div class="summary" id="summary" style="display:none">
        <div class="summary-bar">
            <div class="stat">
                <div class="num" id="statOrders">0</div>
                <div class="lbl">ORDERS IN QUEUE</div>
            </div>
            <div class="stat">
                <div class="num" id="statItems">0</div>
                <div class="lbl">ITEMS TO PREPARE</div>
            </div>
            <div class="stat">
                <div class="num" id="statRevenue">₹0</div>
                <div class="lbl">QUEUE VALUE</div>
            </div>
        </div>
        <div class="prep">
            <h3>👨‍🍳 What the chef needs to prepare right now</h3>
            <div class="prep-list" id="prepList"></div>
        </div>
    </div>
    <div class="board">
        <section class="col">
            <h2>💳 PAID</h2>
            <div id="paid"></div>
        </section>
        <section class="col">
            <h2>👨‍🍳 PREPARING</h2>
            <div id="preparing"></div>
        </section>
        <section class="col">
            <h2>📦 READY</h2>
            <div id="ready"></div>
        </section>
    </div>
    <script>
        let key = localStorage.getItem('adminKey') || ''; document.getElementById('key').value = key;
        function login() { key = document.getElementById('key').value; localStorage.setItem('adminKey', key); load() }
        function card(o) {
            let items = o.items.map(x => `${x.quantity} × ${x.name}`).join('<br>'), action = '';
            let utrHtml = o.utr_number ? `<div class="small" style="color:#0066cc;font-weight:bold;margin:4px 0;">UTR: ${o.utr_number}</div>` : '';
            let custHtml = (o.customer_name || o.customer_phone) ? `<div style="font-size:13px;font-weight:bold;color:#b71c1c;margin:4px 0;">👤 ${o.customer_name || 'Customer'} (${o.customer_phone || 'No phone'})</div>` : '';
            if (o.order_status === 'WAITING') action = `<button class="btn start" onclick="setStatus(${o.id},'PREPARING')">START</button>`;
            if (o.order_status === 'PREPARING') action = `<button class="btn ready" onclick="setStatus(${o.id},'READY')">READY</button>`;
            if (o.order_status === 'READY') action = `<button class="btn deliver" onclick="setStatus(${o.id},'DELIVERED')">DELIVERED</button>`;
            return `<div class="order"><div class="token">#${o.token}</div>${custHtml}<div class="items">${items}</div><div class="total">₹${o.total}</div>${utrHtml}${action}</div>`;
        }
        function draw(id, arr) { document.getElementById(id).innerHTML = arr.length ? arr.map(card).join('') : '<div class="empty">No orders</div>' }
        function renderSummary(activeOrders) {
            document.getElementById('summary').style.display = 'block';
            const totalOrders = activeOrders.length;
            const totalRevenue = activeOrders.reduce((sum, o) => sum + o.total, 0);

            // Aggregate quantities per item across every active order — this is the
            // actual "what to cook" list, independent of which order it came from.
            const itemQty = {};
            activeOrders.forEach(o => {
                o.items.forEach(x => { itemQty[x.name] = (itemQty[x.name] || 0) + x.quantity; });
            });
            const totalItems = Object.values(itemQty).reduce((a, b) => a + b, 0);
            const sortedItems = Object.entries(itemQty).sort((a, b) => b[1] - a[1]);

            document.getElementById('statOrders').textContent = totalOrders;
            document.getElementById('statItems').textContent = totalItems;
            document.getElementById('statRevenue').textContent = '₹' + totalRevenue;
            document.getElementById('prepList').innerHTML = sortedItems.length
                ? sortedItems.map(([name, qty]) => `<span class="prep-item"><span class="qty">${qty}×</span>${name}</span>`).join('')
                : '<span class="small">Nothing in the queue right now.</span>';
        }
        async function load() {
            if (!key) { msg.textContent = 'Enter admin key'; return }
            let r = await fetch('/api/orders', { headers: { 'X-Admin-Key': key } });
            if (!r.ok) { msg.textContent = 'Invalid admin key'; return }
            msg.textContent = 'Auto-refresh: 3 sec';
            let os = await r.json();
            let active = os.filter(o => o.order_status !== 'DELIVERED');
            draw('paid', active.filter(o => o.order_status === 'WAITING'));
            draw('preparing', active.filter(o => o.order_status === 'PREPARING'));
            draw('ready', active.filter(o => o.order_status === 'READY'));
            renderSummary(active);
        }
        async function setStatus(id, s) {
            let r = await fetch(`/api/orders/${id}/status?new_status=${s}`, { method: 'PATCH', headers: { 'X-Admin-Key': key } });
            if (!r.ok) return alert('Could not update order'); load();
        }
        load(); setInterval(load, 3000);
    </script>
</body>

</html>
