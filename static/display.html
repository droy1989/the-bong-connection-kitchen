<!doctype html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>The Bong Connection — Now Serving</title>
    <link rel="icon" href="/static/icons/favicon-32.png" sizes="32x32">
    <link rel="icon" href="/static/icons/favicon-16.png" sizes="16x16">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <style>
        body {
            font-family: system-ui;
            text-align: center;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 30px
        }

        h1 {
            font-size: 38px;
            margin: 0 0 25px
        }

        .label {
            font-size: 28px
        }

        .now {
            font-size: 150px;
            font-weight: 900;
            margin: 5px
        }

        .queue {
            font-size: 38px;
            letter-spacing: 5px;
            margin-top: 10px
        }

        .msg {
            font-size: 30px;
            margin-top: 20px
        }

        .logo {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: block;
            margin: 0 auto 10px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, .4)
        }

        @media(max-width:700px) {
            .now {
                font-size: 100px
            }

            .queue {
                font-size: 26px
            }
        }
    </style>
</head>

<body>
    <img src="/static/images/bong-connection-logo-sm.png" alt="The Bong Connection logo" class="logo">
    <h1>🪔 THE BONG CONNECTION</h1>
    <div class="label">NOW SERVING</div>
    <div class="now" id="now">—</div>
    <div class="msg" id="msg">Please wait for your order</div>
    <div class="label" style="margin-top:35px">GETTING READY</div>
    <div class="queue" id="queue">—</div>
    <script>
        async function load() {
            try {
                let x = await fetch('/api/display').then(r => r.json());
                now.textContent = x.now_serving ? '#' + x.now_serving : '—';
                msg.textContent = x.now_serving ? 'Please collect your order' : 'Please wait for your order';
                queue.textContent = x.queue.length ? x.queue.map(n => '#' + n).join('   ') : '—';
            } catch (e) { }
        }
        load(); setInterval(load, 3000);
    </script>
</body>

</html>
